<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>dsh 控制面板</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <!-- 无边框窗口：自绘标题栏（可拖拽） -->
  <header class="titlebar">
    <span class="dot"></span>
    <span class="title">dsh 控制面板</span>
    <span class="ver" id="ver">v-</span>
    <button class="closebtn" id="btnClose" title="关闭面板">✕</button>
  </header>

  <!-- 状态行：服务状态点 + 地址 + 更新状态 -->
  <div class="statusbar">
    <span class="status-dot" id="svcDot"></span>
    <span class="status-text" id="svcText">检查中…</span>
    <span class="addr" id="svcUrl"></span>
  </div>

  <!-- Tab 页签（dsh web 风格） -->
  <nav class="tabs">
    <button class="tab active" data-tab="ws">工作区</button>
    <button class="tab" data-tab="skills">Skills</button>
    <button class="tab" data-tab="mcp">MCP</button>
  </nav>

  <!-- 工作区 Tab -->
  <section class="pane active" id="pane-ws">
    <div class="list" id="wsList"></div>
  </section>

  <!-- Skills Tab -->
  <section class="pane" id="pane-skills">
    <div class="list" id="skillList"></div>
    <button class="addbtn" id="skillAdd">＋ 添加 Skill</button>
  </section>

  <!-- MCP Tab -->
  <section class="pane" id="pane-mcp">
    <div class="list" id="mcpList"></div>
    <button class="addbtn" id="mcpAdd">＋ 添加 MCP</button>
  </section>

  <!-- Codex 式底部按键行 -->
  <footer class="actions">
    <button class="abtn" id="btnOpen">◧ 打开工作台</button>
    <button class="abtn" id="btnRestart">↻ 重启服务</button>
    <button class="abtn" id="btnUpdate">↻ 检查更新</button>
    <button class="abtn" id="btnDshUpdate" hidden>⬆ dsh</button>
    <button class="abtn" id="btnSkin">🎨 皮肤</button>
    <button class="abtn" id="btnGuide">? 使用说明</button>
  </footer>

  <!-- MCP 添加弹层（手动添加 / 导入已有 两种模式） -->
  <div class="modal" id="mcpModal" hidden>
    <div class="modal-body">
      <h3>添加 MCP</h3>
      <div class="mode-switch">
        <button class="abtn primary" id="modeManual">手动添加</button>
        <button class="abtn" id="modeImport">导入已有</button>
      </div>
      <!-- 手动添加表单 -->
      <div id="manualFields">
        <label>名称 (serverName)
          <input id="mcpName" placeholder="如 github" />
        </label>
        <label>传输方式
          <select id="mcpTransport">
            <option value="stdio">stdio（命令行）</option>
            <option value="streamable-http">streamable-http（HTTP）</option>
          </select>
        </label>
        <div id="stdioFields">
          <label>命令
            <input id="mcpCommand" placeholder="如 npx" />
          </label>
          <label>参数（逗号分隔）
            <input id="mcpArgs" placeholder="如 -y, @modelcontextprotocol/server-github" />
          </label>
        </div>
        <div id="httpFields" hidden>
          <label>URL
            <input id="mcpUrl" placeholder="http://localhost:3000/mcp" />
          </label>
        </div>
      </div>
      <!-- 导入已有视图：列出 cordis.patch.yml 中发现的外部 MCP -->
      <div id="importFields" hidden>
        <div class="list" id="importList" style="max-height:200px;overflow-y:auto"></div>
        <div class="empty" id="importEmpty" hidden>没有发现可导入的 MCP 实例</div>
      </div>
      <div class="modal-actions">
        <button class="abtn" id="mcpCancel">取消</button>
        <button class="abtn primary" id="mcpSave" hidden>保存</button>
      </div>
    </div>
  </div>

  <!-- 皮肤弹层：选择图片应用 / 透明度调节 / 恢复默认 -->
  <div class="modal" id="skinModal" hidden>
    <div class="modal-body">
      <h3>更换皮肤</h3>
      <p class="hint">把本地图片设置为 dsh 工作台的背景（支持 png / jpg / webp / gif，10MB 以内）。切换与透明度调节实时生效，主窗口立即看到效果。</p>
      <div class="mode-switch">
        <button class="abtn primary" id="skinPick">🎨 选择图片应用</button>
        <button class="abtn" id="skinReset">↺ 恢复默认背景</button>
      </div>
      <label style="display:flex;flex-direction:column;gap:4px;color:#9fb0e0;font-size:12px;margin-top:10px">
        背景透明度：<span id="skinOpacityVal">100%</span>
        <input type="range" id="skinOpacitySlider" min="10" max="100" value="100" />
      </label>
      <div class="modal-actions">
        <button class="abtn" id="skinCancel">关闭</button>
      </div>
    </div>
  </div>

  <!-- Skill 添加弹层（手动安装 / 自动搜索导入 两种模式） -->
  <div class="modal" id="skillModal" hidden>
    <div class="modal-body">
      <h3>添加 Skill</h3>
      <div class="mode-switch">
        <button class="abtn primary" id="skillModeManual">手动安装</button>
        <button class="abtn" id="skillModeImport">自动搜索导入</button>
      </div>
      <!-- 手动安装：调主进程弹文件夹/zip 选择器 -->
      <div id="skillManualFields">
        <p class="hint">选择本地的技能文件夹或 zip 压缩包，将复制到 dsh 技能目录。</p>
        <button class="abtn primary" id="skillPick">选择文件夹 / zip</button>
      </div>
      <!-- 自动搜索导入：列出插件市场缓存中发现的技能 -->
      <div id="skillImportFields" hidden>
        <p class="hint">自动搜索本机插件缓存中的技能（未在 dsh 扫描根内的）：</p>
        <input id="skillImportFilter" placeholder="🔍 按名称筛选…" style="margin-bottom:8px" />
        <div class="list" id="skillImportList" style="max-height:220px;overflow-y:auto"></div>
        <div class="empty" id="skillImportEmpty" hidden>没有发现可导入的技能</div>
      </div>
      <div class="modal-actions">
        <button class="abtn" id="skillModalCancel">关闭</button>
      </div>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
